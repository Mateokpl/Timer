<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soft Pink Pomodoro</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
}

.widget{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Carte */
.card{
  width:380px;
  height:250px;

  flex-shrink:0;

  padding:20px 24px;

  border:1px solid rgba(255,255,255,.85);
  border-radius:28px;

  /* Rose très pâle */
  background:rgba(255,245,249,.78);

  box-shadow:
    0 18px 50px rgba(155,91,118,.12),
    inset 0 1px 0 rgba(255,255,255,.9);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  transform-origin:center;
}

/* Modes */

.modes{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:16px;
  white-space:nowrap;
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
  color:#8c6072;

  background:rgba(255,255,255,.65);

  padding:8px 13px;
  border-radius:999px;

  transition:.18s ease;
}

button:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.9);
}

.mode.active{
  background:#eeb5c9;
  color:#fff;

  box-shadow:
    0 5px 16px rgba(206,119,151,.22);
}

/* Timer */

.time{
  text-align:center;

  font-size:64px;
  line-height:1;

  font-weight:650;

  letter-spacing:-3px;

  color:#8b5d70;

  margin:8px 0 16px;
}

/* Barre */

.bar{
  height:6px;

  border-radius:99px;

  background:rgba(255,255,255,.65);

  overflow:hidden;

  margin-bottom:18px;
}

.progress{
  height:100%;
  width:100%;

  transform-origin:left;

  background:linear-gradient(
    90deg,
    #e7a4bc,
    #d98eaa
  );

  border-radius:99px;

  transition:width .2s linear;
}

/* Boutons */

.actions{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.primary{
  background:#d993ad;
  color:#fff;

  padding:11px 23px;

  min-width:96px;

  box-shadow:
    0 8px 18px rgba(201,112,145,.22);
}

/* Empêche le hover de rendre le bouton illisible */
.primary:hover{
  background:#d993ad;
  color:#fff;

  transform:translateY(-1px);
}

.secondary{
  padding:11px 17px;
}

/* Responsive proportionnel */

function resizeWidget(){
  const availableWidth =
    document.documentElement.clientWidth;

  const availableHeight =
    document.documentElement.clientHeight;

  const scale =
    Math.min(
      availableWidth / 380,
      availableHeight / 250
    );

  card.style.transform =
    `scale(${scale})`;
}

window.addEventListener(
  "resize",
  resizeWidget
);

resizeWidget();
</style>
</head>

<body>

<div class="widget">
  <main class="card">

    <div class="modes">
      <button class="mode active" data-mode="focus">
        Focus
      </button>

      <button class="mode" data-mode="short">
        Short Break
      </button>

      <button class="mode" data-mode="long">
        Long Break
      </button>
    </div>

    <div id="time" class="time">
      25:00
    </div>

    <div class="bar">
      <div id="progress" class="progress"></div>
    </div>

    <div class="actions">
      <button id="start" class="primary">
        Start
      </button>

      <button id="reset" class="secondary">
        Reset
      </button>
    </div>

  </main>
</div>

<script>
const durations={
  focus:25*60,
  short:5*60,
  long:15*60
};

let mode="focus";
let remaining=durations[mode];
let timer=null;
let endAt=null;

const timeEl=document.getElementById("time");
const progressEl=document.getElementById("progress");
const startBtn=document.getElementById("start");
const card=document.querySelector(".card");

function render(){

  const m=Math.floor(remaining/60);
  const s=remaining%60;

  timeEl.textContent=
    `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

  progressEl.style.width=
    (remaining/durations[mode]*100)+"%";

  startBtn.textContent=
    timer ? "Pause" : "Start";

  document.title=
    `${timeEl.textContent} — Pomodoro`;
}

function tick(){

  if(!endAt)return;

  remaining=Math.max(
    0,
    Math.ceil((endAt-Date.now())/1000)
  );

  if(remaining<=0){

    clearInterval(timer);

    timer=null;
    endAt=null;
    remaining=0;

    render();

    try{
      new Audio(
        "data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YTAAAAAA"
      ).play();
    }catch(e){}

    return;
  }

  render();
}

function toggle(){

  if(timer){

    clearInterval(timer);

    timer=null;

    remaining=Math.max(
      0,
      Math.ceil((endAt-Date.now())/1000)
    );

    endAt=null;

  }else{

    endAt=
      Date.now()+remaining*1000;

    timer=
      setInterval(tick,250);
  }

  render();
}

function reset(){

  clearInterval(timer);

  timer=null;
  endAt=null;

  remaining=
    durations[mode];

  render();
}

document.querySelectorAll(".mode").forEach(btn=>{

  btn.onclick=()=>{

    mode=btn.dataset.mode;

    document
      .querySelectorAll(".mode")
      .forEach(x=>
        x.classList.toggle(
          "active",
          x===btn
        )
      );

    reset();
  };

});

document
  .getElementById("start")
  .onclick=toggle;

document
  .getElementById("reset")
  .onclick=reset;


/* Responsive proportionnel */

function resizeWidget(){

  const availableWidth =
    document.documentElement.clientWidth;

  const availableHeight =
    document.documentElement.clientHeight;

  const scale =
    Math.min(
      availableWidth / 380,
      availableHeight / 250
    );

  card.style.transform =
    `scale(${scale})`;
}

window.addEventListener(
  "resize",
  resizeWidget
);

resizeWidget();
render();
</script>

</body>
</html>
