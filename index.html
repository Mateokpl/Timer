<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soft Pink Pomodoro</title>
<style>
  *{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  display:grid;
  place-items:center;
  background:transparent;
  color:#7b5364;
  padding:8px;
}

.card{
  width:100%;
  max-width:380px;
  min-width:0;
  padding:clamp(16px,5vw,24px);
  border:1px solid rgba(255,255,255,.78);
  border-radius:clamp(18px,5vw,28px);
  background:rgba(255,255,255,.42);
  box-shadow:
    0 18px 50px rgba(155,91,118,.12),
    inset 0 1px 0 rgba(255,255,255,.75);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.modes{
  display:flex;
  justify-content:center;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:clamp(14px,4vw,20px);
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
  font-size:clamp(11px,3vw,14px);
  color:#8c6072;
  background:rgba(255,255,255,.55);
  padding:clamp(6px,2vw,8px) clamp(9px,3vw,13px);
  border-radius:999px;
  transition:.18s ease;
}

button:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.82);
}

.mode.active{
  background:#eeb5c9;
  color:#fff;
  box-shadow:0 5px 16px rgba(206,119,151,.22);
}

.time{
  text-align:center;
  font-size:clamp(42px,14vw,64px);
  line-height:1;
  font-weight:650;
  letter-spacing:clamp(-2px,-0.5vw,-3px);
  color:#8b5d70;
  margin:clamp(8px,3vw,10px) 0 clamp(16px,4vw,22px);
}

.bar{
  height:clamp(4px,1.5vw,6px);
  border-radius:99px;
  background:rgba(255,255,255,.55);
  overflow:hidden;
  margin-bottom:clamp(16px,4vw,24px);
}

.progress{
  height:100%;
  width:100%;
  transform-origin:left;
  background:linear-gradient(90deg,#e7a4bc,#d98eaa);
  border-radius:99px;
  transition:width .2s linear;
}

.actions{
  display:flex;
  justify-content:center;
  gap:8px;
}

.primary{
  background:#d993ad;
  color:#fff;
  padding:clamp(8px,2.5vw,11px) clamp(16px,5vw,23px);
  min-width:80px;
  box-shadow:0 8px 18px rgba(201,112,145,.22);
}

.secondary{
  padding:clamp(8px,2.5vw,11px) clamp(13px,4vw,17px);
}
</style>
</head>

<body>
<main class="card">
  <div class="modes">
    <button class="mode active" data-mode="focus">Focus</button>
    <button class="mode" data-mode="short">Short Break</button>
    <button class="mode" data-mode="long">Long Break</button>
  </div>

  <div id="time" class="time">25:00</div>

  <div class="bar">
    <div id="progress" class="progress"></div>
  </div>

  <div class="actions">
    <button id="start" class="primary">Start</button>
    <button id="reset" class="secondary">Reset</button>
  </div>
</main>

<script>
const durations={
  focus:25*60,
  short:5*60,
  long:15*60
};

let mode="focus",
    remaining=durations[mode],
    timer=null,
    endAt=null;

const timeEl=document.getElementById("time");
const progressEl=document.getElementById("progress");
const startBtn=document.getElementById("start");

function render(){
  const m=Math.floor(remaining/60),
        s=remaining%60;

  timeEl.textContent=
    `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

  progressEl.style.width=
    (remaining/durations[mode]*100)+"%";

  startBtn.textContent=timer?"Pause":"Start";

  document.title=`${timeEl.textContent} — Pomodoro`;
}

function tick(){
  if(!endAt)return;

  remaining=Math.max(
    0,
    Math.ceil((endAt-Date.now())/1000)
  );

  if(remaining<=0){
    clearInterval(timer);
    timer=null;
    endAt=null;
    remaining=0;
    render();

    try{
      new Audio(
        "data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YTAAAAAA"
      ).play();
    }catch(e){}

    return;
  }

  render();
}

function toggle(){
  if(timer){
    clearInterval(timer);
    timer=null;

    remaining=Math.max(
      0,
      Math.ceil((endAt-Date.now())/1000)
    );

    endAt=null;
  }else{
    endAt=Date.now()+remaining*1000;
    timer=setInterval(tick,250);
  }

  render();
}

function reset(){
  clearInterval(timer);
  timer=null;
  endAt=null;
  remaining=durations[mode];
  render();
}

document.querySelectorAll(".mode").forEach(btn=>{
  btn.onclick=()=>{
    mode=btn.dataset.mode;

    document.querySelectorAll(".mode")
      .forEach(x=>x.classList.toggle("active",x===btn));

    reset();
  };
});

document.getElementById("start").onclick=toggle;
document.getElementById("reset").onclick=reset;

render();
</script>
</body>
</html>
